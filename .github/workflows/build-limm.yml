name: Build limm VPN

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-limm-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'
  APP_NAME: limm-vpn-mac

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set version
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          VERSION="${BASE_VER}.${{ github.run_number }}"
          echo "BASE_VER=$BASE_VER" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "Building version $VERSION (${{ github.sha }})"

      - name: Install system deps
        run: |
          brew install create-dmg
          make macos-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Prepare (download core)
        run: make macos-prepare

      - name: Build macOS app
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build macos --release \
            --build-name=${{ env.BASE_VER }} \
            --build-number=${{ github.run_number }} \
            --dart-define=LIMM_TOKEN=${{ secrets.LIMM_TOKEN }} \
            --dart-define=LIMM_BUILD_SHA=${{ env.SHORT_SHA }}

      - name: Ad-hoc codesign
        run: |
          APP_PATH="build/macos/Build/Products/Release/hiddify.app"
          codesign --sign - --force --deep --verbose "$APP_PATH"
          echo "Signed: $APP_PATH"

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/hiddify.app"
          DMG_NAME="${{ env.APP_NAME }}.dmg"

          # Staging: app + quarantine removal script
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/

          printf '#!/bin/bash\nsudo xattr -rd com.apple.quarantine /Applications/Hiddify.app\necho ""\necho "Done! You can now launch Hiddify.app"\n' \
            > "dmg_staging/Fix Quarantine.command"
          chmod +x "dmg_staging/Fix Quarantine.command"

          create-dmg \
            --volname "limm VPN" \
            --window-size 660 400 \
            --icon-size 90 \
            --icon "hiddify.app" 150 180 \
            --app-drop-link 510 180 \
            --icon "Fix Quarantine.command" 330 310 \
            --no-internet-enable \
            "$DMG_NAME" \
            dmg_staging/

          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          ls -lh "$DMG_NAME"

      - name: Deploy to limm.space
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          REMOTE_TMP="/var/www/limm/vpn/${{ env.APP_NAME }}_tmp.dmg"
          REMOTE_FINAL="/var/www/limm/vpn/${{ env.APP_NAME }}.dmg"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ env.DMG_NAME }}" \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_TMP"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv -f $REMOTE_TMP $REMOTE_FINAL && chmod 644 $REMOTE_FINAL && \
             echo '{\"version\":\"${{ env.VERSION }}\",\"build\":\"${{ env.SHORT_SHA }}\"}' \
               > /var/www/limm/vpn/mac-info.json && chmod 644 /var/www/limm/vpn/mac-info.json && \
             echo 'window.MAC_VER={\"ver\":\"${{ env.VERSION }}\",\"url\":\"/vpn/${{ env.APP_NAME }}.dmg\"};' \
               > /var/www/limm/vpn/mac-version.js && chmod 644 /var/www/limm/vpn/mac-version.js && \
             echo 'Deployed ${{ env.VERSION }}'"

          echo "Deployed: https://limm.space/vpn/${{ env.APP_NAME }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: ${{ env.DMG_NAME }}
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set version
        shell: bash
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          VERSION="${BASE_VER}.${{ github.run_number }}"
          echo "BASE_VER=$BASE_VER" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "Building version $VERSION (${{ github.sha }})"

      - name: Prepare (download core)
        shell: bash
        run: make windows-prepare

      - name: Build Windows app
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build windows --release \
            --build-name=${{ env.BASE_VER }} \
            --build-number=${{ github.run_number }} \
            --dart-define=LIMM_TOKEN=${{ secrets.LIMM_TOKEN }} \
            --dart-define=LIMM_BUILD_SHA=${{ env.SHORT_SHA }}

      - name: Code-sign Windows binaries
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CERT_PFX_BASE64)) {
            Write-Host "WIN_CERT_PFX_BASE64 secret not set — skipping code signing (build stays unsigned)."
            exit 0
          }
          $releaseDir = "build\windows\x64\runner\Release"
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          # Resolve signtool from the installed Windows SDK (newest x64).
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "signtool: $signtool"
          # Sign every PE we ship (exe + dlls), incl. the Go hiddify-core.dll — unsigned Go
          # binaries are the main Defender ML false-positive trigger.
          $targets = Get-ChildItem $releaseDir -Recurse -Include *.exe,*.dll
          foreach ($t in $targets) {
            & $signtool sign /fd SHA256 /f $pfx /p $env:WIN_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($t.Name)" }
          }
          Remove-Item $pfx -Force
          Write-Host "Signed $($targets.Count) binaries."

      - name: Create ZIP
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          # Drop HiddifyCli.exe: the GUI uses hiddify-core.dll in-process and never spawns the
          # CLI. It's an unused standalone Go console binary, and Go console exes are a frequent
          # trigger for Defender's generic ML heuristic (Sabsik!ml) on unsigned downloads.
          Remove-Item "$releaseDir\HiddifyCli.exe" -Force -ErrorAction SilentlyContinue
          $zipName = "limm-vpn-win.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          Get-Item $zipName | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Deploy to limm.space
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$ZIP_NAME" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/limm/vpn/limm-vpn-win_tmp.zip"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv -f /var/www/limm/vpn/limm-vpn-win_tmp.zip /var/www/limm/vpn/limm-vpn-win.zip && \
             chmod 644 /var/www/limm/vpn/limm-vpn-win.zip && \
             echo '{\"version\":\"${{ env.VERSION }}\",\"build\":\"${{ env.SHORT_SHA }}\"}' \
               > /var/www/limm/vpn/win-info.json && chmod 644 /var/www/limm/vpn/win-info.json && \
             echo 'window.WIN_VER={\"ver\":\"${{ env.VERSION }}\",\"url\":\"/vpn/limm-vpn-win.zip\"};' \
               > /var/www/limm/vpn/win-version.js && chmod 644 /var/www/limm/vpn/win-version.js && \
             echo 'Deployed ${{ env.VERSION }}'"

          echo "Deployed: https://limm.space/vpn/limm-vpn-win.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: limm-vpn-win-${{ env.VERSION }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
